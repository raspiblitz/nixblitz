name: common
description: NixBlitz shared business logic — config, git, system operations.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  riverpod: ^3.2.1
  path: ^1.9.1
  http: ^1.2.2
  meta: ^1.18.0
  # Strict semver parsing for plugin manifest `version` fields and
  # the introducing-commit version-tracking flow. Plugins that opt
  # into semver get monotonic upgrade tracking; non-semver `version`
  # strings warn and fall through to SHA-based tracking.
  # See docs/decisions/2026-05-14-plugin-version-tracking.md.
  pub_semver: ^2.1.5
  # Used by services/dashboard/colors.dart for the tile DSL's color
  # resolution. nocterm.Color is a plain RGB value object — depending
  # on it doesn't pull in widget infrastructure.
  nocterm:
    git:
      url: https://forge.f44.fyi/f44/nocterm
      ref: 09cc3b20bf7a27de5bf3c83aea7daef290433d4a
  # sha256 for module_cache.dart's compiled-module cache key.
  crypto: ^3.0.6
  wasmtime_dart:
    path: ../wasmtime_dart

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
