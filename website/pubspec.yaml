name: website
description: Static landing page, docs, and changelog for NixBlitz.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

dependencies:
  jaspr: ^0.23.0
  jaspr_router: ^0.8.2
  jaspr_riverpod: ^0.4.5
  jaspr_content: ^0.5.2

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.4.15
  jaspr_builder: ^0.23.0
  jaspr_tailwind: ^0.3.6
  lints: ^6.1.0

jaspr:
  mode: static

resolution: workspace
