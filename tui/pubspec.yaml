name: tui
description: NixBlitz terminal user interface.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.1
  riverpod: ^3.2.1
  # nocterm is pinned to the fork (v0.8.0 base) while the bare-Esc deferral fix
  # for fragmented CSI sequences (Ghostty / kernel-TTY arrow keys
  # not scrolling — issue #20) is unmerged upstream. Once the
  # upstream PR lands and a release cuts, drop back to a
  # `nocterm: ^0.x.y` pub-published constraint.
  nocterm:
    git:
      url: https://forge.f44.fyi/f44/nocterm
      ref: 09cc3b20bf7a27de5bf3c83aea7daef290433d4a
  nocterm_riverpod:
    git:
      url: https://forge.f44.fyi/f44/nocterm
      path: packages/nocterm_riverpod
      ref: 09cc3b20bf7a27de5bf3c83aea7daef290433d4a
  common:
    path: ../common

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0

# nocterm_riverpod's published pubspec lists `nocterm` from pub.dev,
# which clashes with our git pin above — pub refuses to resolve when
# the same package shows up from two different sources. Force the
# transitive nocterm to match the direct git pin so the lockfile has
# a single source of truth.
dependency_overrides:
  nocterm:
    git:
      url: https://forge.f44.fyi/f44/nocterm
      ref: 09cc3b20bf7a27de5bf3c83aea7daef290433d4a
