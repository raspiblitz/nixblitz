name: WasmtimeRaw
description: Raw bindings over the wasmtime C API. Generated — do not edit.
output: lib/src/generated/bindings.g.dart
# ffigen calls `clang -print-file-name=libclang.so` to locate libclang,
# but `clang` isn't on PATH in this dev shell (only libclang.lib is).
# Pin the store path directly; regenerate with the path from
# `echo $LIBCLANG_PATH` if this goes stale after a nixpkgs bump.
llvm-path:
  - /nix/store/7306wrcri9nmdp7w4pbqc5rqdn6y048d-clang-21.1.8-lib
headers:
  entry-points:
    - .dart_tool/wasmtime-include/wasmtime.h
  # Without this, ffigen also binds every glibc symbol transitively
  # reachable from <string.h>/<stdint.h>/etc (memcpy, strcmp, ...) since
  # those headers are on the include path to satisfy the C compiler.
  # Restrict generated declarations to wasmtime's own C headers.
  include-directives:
    - "**/wasmtime-include/wasm.h"
    - "**/wasmtime-include/wasi.h"
    - "**/wasmtime-include/wasmtime.h"
    - "**/wasmtime-include/wasmtime/*.h"
compiler-opts:
  - -I.dart_tool/wasmtime-include
  - -idirafter
  - .dart_tool/glibc-include
functions:
  exclude:
    - "wasmtime_component_.*"
    - ".*_async"
preamble: |
  // Generated by `just gen-wasmtime-bindings`. Do not edit.
  // ignore_for_file: type=lint
comments:
  style: any
  length: brief
